[project]
name = "cordyhome"
version = "0.2.1"
description = "Hub local e gratuito para gestão de dispositivos IoT Wi-Fi"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "tinytuya>=1.16",
    "tuya-device-sharing-sdk>=0.2.1",
    "segno>=1.6",
    "tzdata>=2024.1",
]

[project.scripts]
cordyhome = "cordyhome.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cordyhome"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Depends() em argumentos padrão é o idioma do FastAPI.
ignore = ["B008"]
