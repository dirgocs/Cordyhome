name: Instalador Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: python3 windows/package.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: Cordyhome-Windows
          path: dist/Cordyhome-Windows.zip
      - name: Publicar na release "windows"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows --cleanup-tag --yes || true
          gh release create windows dist/Cordyhome-Windows.zip \
            --target "$GITHUB_SHA" \
            --title "Instalador Windows (mais recente)" \
            --notes "Gerado automaticamente a partir de ${GITHUB_SHA::7}. Baixe o ZIP, extraia e dê dois cliques em \"Instalar Cordyhome\"."
